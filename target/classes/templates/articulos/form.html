<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout('Artículo', ~{::section})}">
<section>
  <div class="panel" style="max-width:720px">
    <h2 th:text="${articulo.id == null} ? 'Nuevo artículo' : 'Editar artículo'">Artículo</h2>
    <form th:action="${articulo.id == null} ? @{/articulos} : @{'/articulos/' + ${articulo.id}}"
          th:object="${articulo}" method="post">
      <div class="field"><label>Código</label><input type="text" th:field="*{codigo}" required/></div>
      <div class="field"><label>Nombre</label><input type="text" th:field="*{nombre}" required/></div>
      <div class="field"><label>Categoría</label><input type="text" th:field="*{categoria}"/></div>
      <div class="field"><label>Marca</label><input type="text" th:field="*{marca}"/></div>
      <div class="field"><label>Unidad de medida</label><input type="text" th:field="*{unidadMedida}" placeholder="UND, KG, LT..."/></div>
      <div class="field"><label>Stock actual</label><input type="number" th:field="*{stockActual}" min="0"/></div>
      <div class="field"><label>Stock mínimo</label><input type="number" th:field="*{stockMinimo}" min="0"/></div>
      <div class="field"><label>Precio unitario</label><input type="number" step="0.01" th:field="*{precioUnitario}" min="0"/></div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a th:href="@{/articulos}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</section>
</th:block>
</body></html>

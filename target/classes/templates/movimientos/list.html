<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout('Movimientos', ~{::section})}">
<section>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;flex-wrap:wrap">
      <h2>🔁 Movimientos de inventario</h2>
      <div style="display:flex;gap:8px">
        <a th:href="@{/movimientos/nuevo(tipo=ENTRADA)}" class="btn btn-primary">⬇ Registrar entrada</a>
        <a th:href="@{/movimientos/nuevo(tipo=SALIDA)}"  class="btn btn-danger">⬆ Registrar salida</a>
      </div>
    </div>
    <div th:if="${ok}"    class="badge badge-ok"  style="margin-bottom:12px" th:text="${ok}"></div>
    <div th:if="${error}" class="badge badge-low" style="margin-bottom:12px" th:text="${error}"></div>
    <table>
      <thead><tr><th>Fecha</th><th>Tipo</th><th>Artículo</th><th>Cant.</th><th>Motivo / Destino</th><th>Usuario</th><th>Estado</th></tr></thead>
      <tbody>
        <tr th:each="m : ${movimientos}">
          <td th:text="${#temporals.format(m.fecha,'yyyy-MM-dd HH:mm')}"></td>
          <td>
            <span class="badge badge-ok"  th:if="${m.tipo == 'ENTRADA'}">ENTRADA</span>
            <span class="badge badge-low" th:if="${m.tipo == 'SALIDA'}">SALIDA</span>
          </td>
          <td th:text="${articulosMap != null ? articulosMap.get(m.articuloId) : m.articuloId}"></td>
          <td th:text="${m.cantidad}"></td>
          <td th:text="${m.motivo != null ? m.motivo : m.areaDestino}"></td>
          <td th:text="${m.usuario}"></td>
          <td>
            <span class="badge badge-low" th:if="${m.estado == 'PENDIENTE'}">PENDIENTE</span>
            <span class="badge badge-ok" th:if="${m.estado == 'ACEPTADO'}">ACEPTADO</span>
            <span class="badge badge-out" th:if="${m.estado == 'RECHAZADO'}">RECHAZADO</span>
            <span class="badge badge-ok" th:if="${m.estado == null || m.estado == 'PROCESADO'}">PROCESADO</span>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(movimientos)}">
          <td colspan="7" style="text-align:center;color:var(--muted);padding:30px">
            Aún no hay movimientos registrados.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</th:block>
</body></html>

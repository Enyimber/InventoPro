<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout('Proveedor', ~{::section})}">
<section>
  <div class="panel" style="max-width:720px">
    <h2 th:text="${modo == 'crear'} ? '➕ Nuevo proveedor' : '✏️ Editar proveedor'"></h2>
    <form th:action="${modo == 'crear'} ? @{/proveedores} : @{'/proveedores/' + ${proveedor.id}}"
          th:object="${proveedor}" method="post">
      <div class="field"><label>NIT</label><input type="text" th:field="*{nit}" required/></div>
      <div class="field"><label>Razón social</label><input type="text" th:field="*{razonSocial}" required/></div>
      <div class="field"><label>Contacto</label><input type="text" th:field="*{contacto}"/></div>
      <div class="field"><label>Teléfono</label><input type="text" th:field="*{telefono}"/></div>
      <div class="field"><label>Email</label><input type="email" th:field="*{email}"/></div>
      <div class="actions">
        <button class="btn btn-primary" type="submit"
                th:text="${modo == 'crear'} ? 'Crear proveedor' : 'Guardar cambios'"></button>
        <a th:href="@{/proveedores}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</section>
</th:block>
</body></html>

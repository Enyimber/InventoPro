<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout('Dashboard · Almacenista', ~{::section})}">
<section>
  <div class="cards">
    <div class="card"><h3>Total Artículos</h3><div class="value" th:text="${totalArticulos}">0</div></div>
    <div class="card"><h3>Alertas Stock</h3><div class="value" th:text="${totalAlertas}">0</div></div>
    <div class="card"><h3>Movimientos hoy</h3><div class="value" th:text="${movimientosHoy}">0</div></div>
  </div>
  <div class="panel"><h2>⚡ Acciones rápidas</h2>
    <div class="actions">
      <a class="btn btn-primary" th:href="@{/movimientos/nuevo(tipo=ENTRADA)}">➕ Registrar entrada</a>
      <a class="btn btn-primary" th:href="@{/movimientos/nuevo(tipo=SALIDA)}">➖ Registrar salida</a>
      <a class="btn btn-ghost"   th:href="@{/articulos}">📦 Ver artículos</a>
    </div></div>
  <div th:replace="~{dashboards/_charts :: movChart}"></div>
  <div th:replace="~{dashboards/_charts :: alertasTabla}"></div>
</section>
</th:block>
</body></html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout('Nuevo movimiento', ~{::section})}">
<section>
  <div class="panel" style="max-width:720px">
    <h2 th:text="${movimiento.tipo == 'ENTRADA'} ? '⬇ Registrar entrada' : '⬆ Registrar salida'">Movimiento</h2>
    <form th:action="@{/movimientos}" th:object="${movimiento}" method="post">
      <input type="hidden" th:field="*{tipo}"/>
      <div class="field">
        <label>Artículo</label>
        <select th:field="*{articuloId}" required>
          <option value="">-- selecciona --</option>
          <option th:each="a : ${articulos}"
                  th:value="${a.id}"
                  th:text="|${a.codigo} · ${a.nombre} (stock: ${a.stockActual})|"></option>
        </select>
      </div>
      <div class="field"><label>Cantidad</label><input type="number" min="1" th:field="*{cantidad}" required/></div>
      <div class="field" th:if="${movimiento.tipo == 'ENTRADA'}">
        <label>Precio unitario</label><input type="number" step="0.01" th:field="*{precioUnitario}"/>
      </div>
      <div class="field" th:if="${movimiento.tipo == 'ENTRADA'}">
        <label>Proveedor</label><input type="text" th:field="*{proveedorId}" placeholder="ID o nombre"/>
      </div>
      <div class="field" th:if="${movimiento.tipo == 'SALIDA'}">
        <label>Área / Destino</label><input type="text" th:field="*{areaDestino}" placeholder="Ej: Ventas, Producción..."/>
      </div>
      <div class="field"><label>Motivo / Observación</label><input type="text" th:field="*{motivo}"/></div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Registrar</button>
        <a th:href="@{/movimientos}" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</section>
</th:block>
</body></html>

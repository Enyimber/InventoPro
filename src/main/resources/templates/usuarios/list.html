<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout('Usuarios', ~{::section})}">
<section>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2>👥 Usuarios del sistema</h2>
      <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo usuario</a>
    </div>
    <div th:if="${ok}"    class="badge badge-ok"  style="margin-bottom:12px" th:text="${ok}"></div>
    <div th:if="${error}" class="badge badge-low" style="margin-bottom:12px" th:text="${error}"></div>
    <table>
      <thead><tr><th>Usuario</th><th>Nombre</th><th>Email</th><th>Roles asignados</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody>
        <tr th:each="u : ${usuarios}">
          <td><strong th:text="${u.username}"></strong></td>
          <td th:text="${u.nombreCompleto}"></td>
          <td th:text="${u.email}"></td>
          <td>
            <span th:each="r : ${u.roles}"
                  th:text="${r}"
                  th:classappend="${r == 'ADMIN'} ? 'badge badge-low' : 'badge badge-ok'"
                  style="margin-right:4px"></span>
          </td>
          <td>
            <span class="badge badge-ok"  th:if="${u.activo}">Activo</span>
            <span class="badge badge-low" th:unless="${u.activo}">Inactivo</span>
          </td>
          <td class="actions">
            <a th:href="@{'/usuarios/' + ${u.id} + '/editar'}" class="btn btn-ghost">Editar</a>
            <a th:href="@{'/usuarios/' + ${u.id} + '/toggle'}" class="btn btn-ghost"
               th:text="${u.activo} ? 'Desactivar' : 'Activar'"></a>
            <a th:href="@{'/usuarios/' + ${u.id} + '/eliminar'}" class="btn btn-danger"
               onclick="return confirm('¿Eliminar este usuario?')">Eliminar</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
          <td colspan="6" style="text-align:center;color:var(--muted);padding:30px">
            No hay usuarios registrados.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</th:block>
</body></html>

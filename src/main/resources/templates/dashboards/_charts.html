<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="movChart">
  <div class="panel">
    <h2>📈 Movimientos últimos 7 días</h2>
    <canvas id="movChart" height="90"></canvas>
  </div>
  <script th:inline="javascript">
    (function(){
      const labels = /*[[${chartLabels}]]*/ [];
      const ent = /*[[${chartEntradas}]]*/ [];
      const sal = /*[[${chartSalidas}]]*/ [];
      const ctx = document.getElementById('movChart');
      if (ctx) new Chart(ctx, {
        type:'line',
        data:{labels:labels, datasets:[
          {label:'Entradas', data:ent, borderColor:'#22d3ee', backgroundColor:'rgba(34,211,238,.15)', tension:.35, fill:true},
          {label:'Salidas',  data:sal, borderColor:'#f59e0b', backgroundColor:'rgba(245,158,11,.15)', tension:.35, fill:true}
        ]},
        options:{plugins:{legend:{labels:{color:'#e8ecff'}}},
          scales:{x:{ticks:{color:'#9aa3c7'}}, y:{ticks:{color:'#9aa3c7'}, beginAtZero:true}}}
      });
    })();
  </script>
</div>

<div th:fragment="topChart">
  <div class="panel">
    <h2>🏆 Top 5 artículos por volumen</h2>
    <canvas id="topChart" height="90"></canvas>
  </div>
  <script th:inline="javascript">
    (function(){
      const labels = /*[[${topLabels}]]*/ [];
      const values = /*[[${topValues}]]*/ [];
      const ctx = document.getElementById('topChart');
      if (ctx) new Chart(ctx, {
        type:'bar',
        data:{labels:labels, datasets:[{label:'Unidades',
          data:values, backgroundColor:'rgba(99,102,241,.7)', borderRadius:8}]},
        options:{plugins:{legend:{display:false}},
          scales:{x:{ticks:{color:'#9aa3c7'}}, y:{ticks:{color:'#9aa3c7'}, beginAtZero:true}}}
      });
    })();
  </script>
</div>

<div th:fragment="alertasTabla">
  <div class="panel">
    <h2>⚠️ Artículos bajo stock mínimo</h2>
    <table>
      <thead><tr><th>Código</th><th>Nombre</th><th>Stock</th><th>Mínimo</th><th></th></tr></thead>
      <tbody>
        <tr th:each="a : ${articulosBajos}">
          <td th:text="${a.codigo}"></td><td th:text="${a.nombre}"></td>
          <td th:text="${a.stockActual}"></td><td th:text="${a.stockMinimo}"></td>
          <td><span class="badge badge-low">Bajo stock</span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(articulosBajos)}">
          <td colspan="5" style="text-align:center;color:var(--muted);padding:24px">
            ✅ Todo el stock está en niveles esperados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout('Dashboard · Auditor', ~{::section})}">
<section>
  <div class="cards">
    <div class="card"><h3>Total Artículos</h3><div class="value" th:text="${totalArticulos}">0</div></div>
    <div class="card"><h3>Alertas Stock</h3><div class="value" th:text="${totalAlertas}">0</div></div>
    <div class="card"><h3>Movimientos hoy</h3><div class="value" th:text="${movimientosHoy}">0</div></div>
  </div>
  <div th:replace="~{dashboards/_charts :: movChart}"></div>
  <div th:replace="~{dashboards/_charts :: alertasTabla}"></div>
  <div class="panel"><h2>🔎 Reportes</h2>
    <p style="color:var(--muted)">Modo solo-consulta. Use las secciones de Artículos y Movimientos para auditar.</p>
    <div class="actions" style="margin-top:12px">
      <a class="btn btn-ghost" th:href="@{/articulos}">📦 Ver inventario</a>
      <a class="btn btn-ghost" th:href="@{/movimientos}">🔁 Ver movimientos</a>
    </div></div>
</section>
</th:block>
</body></html>
